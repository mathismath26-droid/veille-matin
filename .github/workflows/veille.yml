name: Veille du matin

on:
  schedule:
    # 8h a Paris : 7h UTC en hiver, 6h UTC en ete. Le script n'envoie qu'a 8h Paris.
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Envoyer la veille
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: mathis.miallet89@gmail.com
        run: python veille.py

      - name: Memoriser les liens envoyes
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "Liens envoyes" && git push)
